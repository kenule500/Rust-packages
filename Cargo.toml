[workspace]
# Resolver 3 makes dependency resolution honour `rust-version`, so a fresh
# resolve never picks a transitive crate that needs a newer compiler than 1.85.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenule500/Rust-packages"

# One version set for every workspace crate. M4 media crates enable only the
# features they need; no crate may silently drift to a different major.
[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.11.0", features = ["v7"] }
chrono = "0.4.40"
url = "2.5.4"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
getrandom = "0.2.15"
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls"] }
axum = "0.8.1"
