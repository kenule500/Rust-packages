[package]
name = "syncforge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "A durable action queue with UUID v7 idempotency, per-action batch results, and explicit conflict strategies for offline-first Rust clients."
keywords = ["offline-first", "sync", "idempotency", "conflict-resolution"]
categories = ["development-tools"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "src/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
