[package]
name = "platform-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Tenant and provider identity, capabilities, an explicit provider registry, and a token-store contract for multi-provider Rust services."
keywords = ["multi-tenant", "provider", "registry", "traits"]
categories = ["development-tools"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "src/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["registry", "memory"]
registry = []
memory = []

[dependencies]
# Declared directly: the workspace has no [workspace.dependencies], and this
# crate is standalone (it depends on no other workspace crate).
async-trait = "0.1"
secrecy = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
