[workspace]
# Resolver 3 is MSRV-aware: dependencies are resolved against the `rust-version`
# below, so a fresh lockfile stays buildable on Rust 1.85 (AC-039).
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenule500/Rust-packages"
