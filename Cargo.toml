[workspace]
# Resolver 3 is MSRV-aware: dependencies are resolved against the `rust-version`
# below, so a fresh lockfile stays buildable on Rust 1.87 (AC-039).
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2021"
# 1.87 is the floor required by the patched ECDSA stack (p256 0.14 ->
# elliptic-curve 0.14 -> crypto-bigint 0.7 + ctutils 0.4), which is what makes
# RUSTSEC-2026-0387 fixable. Raising this again requires a constitution
# amendment (CON-102).
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenule500/Rust-packages"

# MSVC 14.50 (VS 18 BuildTools) rejects the `/Z7` debug records that ring's
# build script passes to cl.exe, failing with `D8050: cannot execute c1.dll`
# even though c1.dll is present. Disabling debug info for ring alone keeps the
# dev profile (and `cargo test --workspace --all-features`) buildable without
# changing a dependency or the test command. Remove once ring/cc-rs is bumped.
[profile.dev.package.ring]
debug = false

