[package]
name = "hookgate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Inbound webhook verification on raw bytes, replay windows, durable deduplication, an outbox, and dead-letter replay."
keywords = ["webhook", "hmac", "idempotency", "outbox"]
categories = ["web-programming", "authentication"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "src/**",
    "examples/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["presets"]
presets = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
platform-core.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
platform-core.workspace = true
quota-ledger = { path = "../quota-ledger", version = "0.1.0" }
tokio.workspace = true
