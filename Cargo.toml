[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenule500/Rust-packages"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hmac = "0.12.1"
http = "1.5.0"
platform-core = { path = "crates/platform-core", version = "0.1.0" }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
