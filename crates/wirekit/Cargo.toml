[package]
name = "wirekit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "One HTTP client for many providers: a shared error type, retry policy, rate limiter, auth layer, and request pipeline."
keywords = ["http", "api-client", "retry", "rate-limit", "webhook"]
categories = ["api-bindings", "web-programming::http-client"]
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "src/**",
    "examples/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []

# TLS backend alternative. rustls is compiled in unconditionally and is the
# default; enabling this feature adds the platform-native backend as well.
native-tls = ["reqwest/native-tls"]

# Provider modules. Each is independent: enabling one MUST NOT enable another.
noaa = []
twilio = ["dep:sha1", "dep:serde_urlencoded"]
sendgrid = ["dep:hex", "dep:p256", "dep:ecdsa"]
slack = ["dep:hex"]

# M5 gated integrations. Angi has no public API, so it parses bytes the caller
# already has; the other three talk to a provider and need no extra dependency
# beyond the client, retry, and rate-limit machinery already compiled in.
angi = ["dep:csv"]
google-lsa = []
sage-intacct = ["dep:quick-xml"]
adp = []

[dependencies]
reqwest = { version = "0.12.23", default-features = false, features = [
    "rustls-tls",
    "json",
    "charset",
] }
tokio = { version = "1.44.2", features = ["rt", "time", "macros", "sync"] }
tracing = "0.1.41"
thiserror = "2.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
http = "1.3.1"
rand = "0.8.5"
async-trait = "0.1.88"
url = "2.5.4"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
percent-encoding = "2.3.1"

sha1 = { version = "0.10.6", optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }
hex = { version = "0.4.3", optional = true }
p256 = { version = "0.13.2", optional = true, default-features = false, features = [
    "ecdsa",
    "pkcs8",
    "std",
] }
ecdsa = { version = "0.16.9", optional = true, default-features = false, features = [
    "std",
    "der",
] }

# M5 gated integrations. Both are optional and gate on their own feature, so a
# build without `angi` or `sage-intacct` carries neither.
# Licences verified on crates.io: csv 1.4.0 is Unlicense/MIT, quick-xml 0.42.0 is
# MIT - both compatible with this crate's MIT OR Apache-2.0.
csv = { version = "1.4.0", optional = true }
quick-xml = { version = "0.42.0", optional = true }

[dev-dependencies]
serde_json = "1.0.140"
# Pinned exactly: 0.6.4+ use `let` chains in conditions and need Rust 1.88,
# which would break the MSRV 1.85 test job (Cargo.lock is not committed).
wiremock = "=0.6.3"
# Integration tests are separate crates: they cannot borrow the library's own
# `tokio` or `tracing` dependencies, so the test harness declares them itself.
tokio = { version = "1.44.2", features = ["macros", "rt", "time"] }
tracing = "0.1.41"

[[example]]
name = "noaa"
required-features = ["noaa"]

[[example]]
name = "twilio"
required-features = ["twilio"]

[[example]]
name = "sendgrid"
required-features = ["sendgrid"]

[[example]]
name = "slack"
required-features = ["slack"]
