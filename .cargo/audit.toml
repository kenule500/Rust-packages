# cargo-audit configuration. cargo-audit reads `.cargo/audit.toml` from the
# project root (or `~/.cargo/audit.toml` from the user home); a file at the
# repository root is ignored.
#
# Keep `ignore` empty unless an advisory genuinely cannot be fixed, and always
# record the RUSTSEC ID, the reason, and the condition that removes the entry.

[advisories]
# Empty on purpose: the MSRV move to 1.87 allowed the patched ECDSA stack
# (p256 0.14 / ecdsa 0.17 -> elliptic-curve 0.14 -> crypto-bigint 0.7.10), so
# RUSTSEC-2026-0387 no longer applies. Add entries here only for an advisory
# that genuinely cannot be fixed, and record the RUSTSEC ID, the reason, and the
# condition that removes the entry.
ignore = []
